name: P11 Verify

on:
  push:
    branches:
      - P11
  workflow_dispatch:

# This workflow is intentionally touched at the end of the P11.9 consolidation
# so the verification run proves the current branch head, not an earlier patch.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
