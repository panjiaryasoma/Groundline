name: P11 Verify

on:
  push:
    branches:
      - P11
  workflow_dispatch:

# Final P11 consolidation gate. A green run must correspond to the current
# product-journey contract and implementation, not an earlier P11 patch.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
